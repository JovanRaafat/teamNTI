<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="shortcut icon" href="img/p1.jpg" type="image/x-icon" />
		<title>Jovan</title>
	</head>
	<body>
		<h1>Lorem.</h1>
		<p>
			Lorem ipsum dolor sit amet consectetur adipisicing elit. Recusandae
			nesciunt magnam mollitia. Mollitia hic quas at, autem nostrum qui
			temporibus labore. Nulla, dicta. Quasi incidunt impedit adipisci,
			aspernatur ut accusamus!
		</p>
		<img src="img/p1.jpg" alt="image" />
		<hr />
		<a href="https://www.google.com/" target="_blank">google</a>
		<hr />

		<form>
			<label for="username">Username</label>
			<input type="text" id="username" name="username" />
			<br /><br />

			<label for="password">Password</label>
			<input type="password" id="password" name="password" />
			<br /><br />

			<label for="phone">Phone Number</label>
			<input type="tel" id="phone" name="phone" placeholder="01012345678" />
			<br /><br />

			<label for="email">Email</label>
			<input
				type="email"
				id="email"
				name="email"
				placeholder="example@email.com"
			/>
			<br /><br />

			<label for="message">Message</label>
			<br />
			<textarea
				id="message"
				name="message"
				rows="5"
				cols="30"
				placeholder="Write your message here"
			></textarea>
			<br /><br />
			<button type="reset">reset</button>
			<button type="submit">Sign Up</button>
		</form>
	</body>
</html>
